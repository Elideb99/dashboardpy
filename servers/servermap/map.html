<style>
html, body {
    margin: 0;
    padding: 0;

#map {

/* ─── Legenda ─────────────────────────────────────────────── */


.legend {
    position: fixed;
    bottom: clamp(10px, 2vh, 30px);
    left: clamp(10px, 2vw, 30px);
    background: rgba(25, 34, 48, 0.95);
    padding: clamp(12px, 1.5vw, 24px) clamp(16px, 2vw, 30px);
    border-radius: clamp(8px, 0.8vw, 14px);
    border: 1px solid #4175C0;
    color: white;
    font-family: monospace;
    font-size: clamp(13px, 1.2vw, 30px);
    z-index: 1000;
    backdrop-filter: blur(5px);
    max-width: min(calc(100% - 40px), 360px);
}

.legend h4 {
    margin: 0 0 clamp(8px, 0.8vw, 14px) 0;
    font-size: 1.25em;
}

.legend .row {
    display: flex;
    align-items: center;
    margin-bottom: clamp(5px, 0.6vw, 10px);
    gap: clamp(8px, 1vw, 14px);
}

.legend .color-box {
    width: 1.5em;
    height: 1.5em;
    min-width: 14px;
    min-height: 14px;
    border-radius: 50%;

}

.replay-box {

    right: clamp(10px, 2vw, 30px);   /* ancorato a destra */
    left: auto;
    bottom: clamp(34px, 5vh, 54px);  /* un po' più su, così non copre l'attribution "Leaflet | ©…" */
    transform: none;

    color: #fff; font-family: monospace;

}
.replay-box.attivo { display: block; }
.replay-box .rb-head {
    display: flex; align-items: center; justify-content: space-between;

}
.replay-box .rb-title { font-weight: bold; color: #a0c4e8; }
.replay-box .rb-count { opacity: .75; }
.replay-box .rb-close {

.replay-box .rb-body { display: flex; gap: 16px; padding: 12px 14px; align-items: center; }

.replay-box .rb-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.replay-box .rb-mag { font-size: 2.2em; font-weight: bold; line-height: 1; }

.replay-box .rb-bar { height: 6px; background: #2a3a52; border-radius: 3px; margin-top: 14px; overflow: hidden; }
.replay-box .rb-bar > div { height: 100%; width: 0; background: #4175C0; transition: width .25s; }

/* ─── Popup Leaflet ──────────────────────────────────────── */

<script>
// ══════════════════════════════════════════════════════════════
//  UTILITY – dimensioni responsive
// ══════════════════════════════════════════════════════════════

// raggio del marker del VULCANO (non degli eventi sismici, vedi tempo2raggio più sotto)
function markerRadius(stato) {
    const base = Math.max(8, Math.round(window.innerWidth / 160));
    // ~12 a 1920px · ~20 a 3200px · ~27 a 4320px · ~40 a 6400px
    const delta = { 'ALLARME': 8, 'ATTENZIONE': 4, 'SCIAME': 6 };
    return base + (delta[stato] || 0);
}

/**
 * Raggio del cerchio di monitoraggio attorno al vulcano (in metri),
 * costante in termini geografici ma la funzione è centralizzata
 * per poterlo modificare facilmente.
 */
function circleRadius() {
    return 5000;   // 5 km – invariato sulla mappa geografica
}

/**
 * Padding fitBounds adattato alla larghezza schermo.
 */
function fitPadding() {
    const w = window.innerWidth;
    const p = Math.round(w / 25);   // ~77 a 1920 · ~154 a 3840 · ~250 a 6400
    return { paddingTopLeft: [p, p], paddingBottomRight: [p, p] };
}

/**
 * Zoom iniziale adattato alla larghezza schermo.
 * Su schermi piccoli la mappa mostra meno tile quindi zoom 10
 * va bene; su schermi enormi si può abbassare per mostrare
 * il contesto geografico più ampio.
 */


function initialZoom() {
    const w = window.innerWidth;
    // Zoom molto alti per vedere i dettagli dei vulcani
    if (w >= 5000) return 13;
    if (w >= 3200) return 14;
    if (w >= 2000) return 14;
    if (w >= 1200) return 15;   // molto vicino su desktop
    return 14;                  // mobile
}

// E modifica anche il fitToVulcani per non allontanarsi troppo
function fitToVulcani() {
    if (!map) return;
    const bounds = getVulcaniBounds();
    // Usa maxZoom per evitare che si allontani troppo
    map.fitBounds(bounds, {
        padding: [15, 15],
        maxZoom: initialZoom()  // Usa lo stesso zoom iniziale
    });
}

// ══════════════════════════════════════════════════════════════
//  VARIABILI GLOBALI
// ══════════════════════════════════════════════════════════════
let map           = null;
let currentLayer  = null;   // layer del tile provider attivo (per poterlo rimuovere al cambio provider)
let resizeTimeout = null;   // debounce per l'evento resize
let isInitialized = false;

const vulcaniData = { /* coordinate di ogni vulcano */
    'VESUVIO': {
        nome: 'Vesuvio',
        lat: 40.8214, lng: 14.4265,
        stato: 'NORMALE', magnitudo: 0,
        //marker: null,
         circle: null,
         fill:false,
        colori: {
            'NORMALE':    '#2e7d32',
            'ATTENZIONE': '#ff9800',
            'ALLARME':    '#d32f2f',
            'SCIAME':     '#ef6c00'
        }
    },
    'CAMPI FLEGREI': {
        nome: 'Campi Flegrei',
        lat: 40.8270, lng: 14.1390,
        stato: 'NORMALE', magnitudo: 0,
        marker: null, circle: null,
        colori: {
            'NORMALE':    '#2e7d32',
            'ATTENZIONE': '#ff9800',
            'ALLARME':    '#d32f2f',
            'SCIAME':     '#ef6c00'
        }
    },
    'ISCHIA': {
        nome: 'Ischia',
        lat: 40.7320, lng: 13.9486,
        stato: 'NORMALE', magnitudo: 0,
        marker: null, circle: null,
        colori: {
            'NORMALE':    '#2e7d32',
            'ATTENZIONE': '#ff9800',
            'ALLARME':    '#d32f2f',
            'SCIAME':     '#ef6c00'
        }
    }
};

// ══════════════════════════════════════════════════════════════
//  MAPPA
// ══════════════════════════════════════════════════════════════
function getVulcaniBounds() { // restituisce array di coordinate [[lat,lang], [lat,lng], [lat,lng]]
    return Object.values(vulcaniData).map(v => [v.lat, v.lng]);
}


function handleResize() {
    if (!map) return;

    clearTimeout(resizeTimeout);

    // debounce: aspetta 250ms di calma dopo l'ultimo evento resize prima di ricalcolare
    resizeTimeout = setTimeout(() => {
        map.invalidateSize();
        fitToVulcani();

        for (const zona in vulcaniData) {
            const v = vulcaniData[zona];

            if (v.marker) {
                v.marker.setRadius(markerRadius(v.stato));
            }
        }
    }, 250);
}

function initMap() {
    if (isInitialized && map !== null) return;   // evita doppia inizializzazione
    if (map !== null) { map.remove(); map = null; }

    const container = document.getElementById('map');
    if (!container) { console.error('#map non trovato'); return; }

    try {
        map = L.map('map', {
            zoomControl:         true,
            fadeAnimation:       true,
            zoomAnimation:       true,
            markerZoomAnimation: true,
            inertia:             true,
            inertiaDeceleration: 3000,
            inertiaMaxSpeed:     1500
        });

        // pane separati per controllare l'ordine di sovrapposizione: i vulcani sempre sopra gli eventi
        map.createPane('vulcaniPane');
map.getPane('vulcaniPane').style.zIndex = 650;  // sempre sopra i pallini eventi

map.createPane('eventiPane');
map.getPane('eventiPane').style.zIndex = 400;   // sotto i vulcani

window.eventiRenderer = L.canvas({ pane: 'eventiPane' });  // renderer canvas condiviso per gli eventi (performance con tanti pallini)



        if (window.innerWidth <= 768) {
            map.zoomControl.setPosition('bottomright');
        }

        map.setView([40.82, 14.25], initialZoom());
        isInitialized = true;
        console.log('Mappa inizializzata');
    } catch (err) {
        console.error('Errore inizializzazione mappa:', err);
        isInitialized = false;
    }
}

// ══════════════════════════════════════════════════════════════
//  BASE MAP
// ══════════════════════════════════════════════════════════════
window.setBaseMap = function(url, attribution, minZoom , maxZoom) {
    if (!map || !isInitialized) { initMap(); }

    setTimeout(() => {
        if (!map) { console.error('setBaseMap: mappa non disponibile'); return; }

        if (currentLayer) { map.removeLayer(currentLayer); }

        window._baseMapCfg = { url: url, attribution: attribution || '', maxZoom: maxZoom || 18 };

        currentLayer = L.tileLayer(url, {
            attribution: attribution || '',
            minZoom: minZoom || 0,
            maxZoom: maxZoom || 18
        }).addTo(map);

        setTimeout(() => {
    if (map) fitToVulcani();
}, 100);
        
    }, 50);
};
// permette di cambiare provider di mappa a runtime 



// ══════════════════════════════════════════════════════════════
//  VULCANI
// ══════════════════════════════════════════════════════════════
function aggiornaColore(zona, stato, magnitudo) { // aggiorna il colore del vulcano
    if (!vulcaniData[zona] || !map || !isInitialized) return;

    const v = vulcaniData[zona];
    v.stato = stato;
    if (magnitudo != null) v.magnitudo = magnitudo;

    const colore  = v.colori[stato] || v.colori['NORMALE'];
    const coloreMarker = '#9C27B0';
    const raggio  = markerRadius(stato);

    // ── Marker ──────────────────────────────────────────────
   

if (v.circle) map.removeLayer(v.circle);

const magTesto = (magnitudo !== undefined && magnitudo !== null)
    ? `<br>Ultima magnitudo: <b>M${magnitudo}</b>`
    : '';

// Genera i punti di un cerchio approssimato come poligono
function generateRing(lat, lng, outerR, innerR, steps = 64) {
    const toRad = Math.PI / 180;
    const latR  = outerR / 111320;
    const lngR  = outerR / (111320 * Math.cos(lat * toRad));
    const latRi = innerR / 111320;
    const lngRi = innerR / (111320 * Math.cos(lat * toRad));

    const outer = [], inner = [];
    for (let i = 0; i < steps; i++) {
        const a = (2 * Math.PI * i) / steps;
        outer.push([lat + latR  * Math.sin(a), lng + lngR  * Math.cos(a)]);
        inner.push([lat + latRi * Math.sin(a), lng + lngRi * Math.cos(a)]);
    }
    return [outer, inner.reverse()]; // il buco va in senso opposto
}

// ATTENZIONE: colore, coloreMarker, raggio, magTesto e generateRing sono calcolati
// ma non usati: la funzione rimuove il vecchio v.circle e basta, non disegna/aggiorna
// nessun marker o cerchio nuovo, né riassegna v.circle. Sembra un refactor incompleto:
// verificare se manca la creazione del layer (marker/cerchio) prima della fine della funzione.

}

function inizializzaVulcani() {
    if (!map || !isInitialized) return;
    for (const zona in vulcaniData) {
        aggiornaColore(zona, 'NORMALE', null);
    }
    console.log('Vulcani inizializzati');
}

// ══════════════════════════════════════════════════════════════
//  API ESPOSTE A PYTHON
// ══════════════════════════════════════════════════════════════
window.aggiornaStatoVulcano = function(zona, stato, magnitudo) {
    if (!map || !isInitialized) {
        // la mappa non è ancora pronta (caricamento asincrono): riprova ogni 100ms per max 5s
        const iv = setInterval(() => {
            if (map && isInitialized) {
                clearInterval(iv);
                aggiornaColore(zona, stato, magnitudo);
            }
        }, 100);
        setTimeout(() => clearInterval(iv), 5000);
        return;
    }
    aggiornaColore(zona, stato, magnitudo);
};


window.refreshMapView = function() {
    if (map && isInitialized) {
        setTimeout(() => {
            map.invalidateSize();
            fitToVulcani();
        }, 100);
    }
};


window.zoomToVulcano = function(zona) { // centra la mappa su un vulcano specifico e apre il pop up informativo
    if (!map || !isInitialized) return; // se la mappa non esiste o non è stata inizializzata esce senza fare nulla
    const v = vulcaniData[zona]; // recupera i dati dal vulcano
    if (!v) return;
    map.flyTo([v.lat, v.lng], 13, {  // sposta la mappa sulle coordinate del vulcano
        animate: true,
        duration: 1.2
    });

};

window.zoomToAll = function() {
    if (!map || !isInitialized) return;
    fitToVulcani();
};

// ══════════════════════════════════════════════════════════════
//  EVENTI SISMICI – pallini proporzionali alla magnitudo
// ══════════════════════════════════════════════════════════════

// Array master: contiene TUTTI gli eventi ricevuti (mai svuotato dal filtro)
const eventiMaster = [];
// Array dei marker attualmente sulla mappa
const eventiLayer  = [];

window.currentFilter = "24h";


/**
 * Calcola il raggio del pallino in base al tempo trascorso.
 *
 * Scossa recente  → pallino grande
 * Scossa vecchia  → pallino piccolo
 */
function tempo2raggio(dataEvento) {
    const raggioMinimo = 5;
    const raggioMassimo = 18;

    if (!dataEvento) {
        return raggioMinimo;
    }

    const timestamp = Date.parse(
        String(dataEvento).replace(' ', 'T')
    );

    if (isNaN(timestamp)) {
        return raggioMinimo;
    }

    const tempoTrascorso = Math.max(0, Date.now() - timestamp);

    /*
     * La dimensione viene rapportata al filtro selezionato:
     *
     * 24h   → il pallino si riduce nell'arco di 24 ore
     * 48h   → il pallino si riduce nell'arco di 48 ore
     * 7gg   → il pallino si riduce nell'arco di 7 giorni
     * ecc.
     *
     * Con "all" viene usato un intervallo massimo di 30 giorni.
     */
    let intervallo = filterDelta(window.currentFilter);

    if (!isFinite(intervallo)) {
        intervallo = 30 * 24 * 60 * 60 * 1000;
    }

    // 0 = evento appena avvenuto
    // 1 = evento arrivato al limite temporale del filtro
    const percentualeEta = Math.min(
        tempoTrascorso / intervallo,
        1
    );

    // Il raggio diminuisce gradualmente con l'età
    const raggio =
        raggioMassimo -
        percentualeEta * (raggioMassimo - raggioMinimo);

    return Math.round(raggio);
}

// colore del pallino evento in base alla magnitudo (soglie coerenti con la legenda in HTML)
function magnitudo2colore(mag) {
    if (mag >= 3.0) return '#e53935';
    if (mag >= 2.0) return '#ff9800';
    if (mag >= 1.0) return '#f9d71c';
    return '#1B7A3D'; // verde
}

// converte la chiave del filtro (24h/48h/7gg/...) nella durata in millisecondi corrispondente
function filterDelta(filterKey) {
    if (filterKey === "all") {
        return Infinity;   
    }
    const MS = {
        "24h":   24 * 3600 * 1000,
        "48h":   48 * 3600 * 1000,
        "7gg":    7 * 86400 * 1000,
        "14gg":  14 * 86400 * 1000,
        "1mese": 30 * 86400 * 1000,
    };
    return MS[filterKey] || MS["24h"];
}

// disegna un singolo evento come circleMarker sulla mappa e ne registra il popup
function _disegnaEvento(e) {
    // const raggio = magnitudo2raggio(e.mag);
    const raggio = tempo2raggio(e.data);
    const colore = magnitudo2colore(e.mag);
    const magStr = (e.mag !== null && e.mag !== undefined)
        ? `Md${e.mag}`
        : 'M n.d.';

    const area = e.area || 'n.d.';

    const pallino = L.circleMarker([e.lat, e.lng], {
        radius:      raggio,
        color:       '#ffffff',      // ← bordo bianco invece del colore magnitudo
        fillColor:   colore,
        fillOpacity: 1,             // ← più pieno (era 0.75)
        weight:      1,               // ← bordo più spesso (era 1)
        opacity:     1,               // ← bordo sempre opaco
        pane:        'eventiPane',
        renderer:    window.eventiRenderer
        
    }).addTo(map);

    pallino.bindPopup(`
        <div style="min-width:130px; font-size:0.95em;">
            <b>${area}</b><br>
            <b>${magStr}</b><br>
            ${e.data}<br>
            Qualità: ${e.qualita}<br>
            <small>(${Number(e.lat).toFixed(4)}, ${Number(e.lng).toFixed(4)})</small>
        </div>
    `);

    eventiLayer.push(pallino);
    return pallino;
}

// ridisegna solo gli eventi che rientrano nel filtro temporale attivo (non tocca eventiMaster)
function applyFilter() {
    // 1. Rimuovi tutti i marker dalla mappa
    eventiLayer.forEach(c => map && map.removeLayer(c));
    eventiLayer.length = 0;

    // 2. Calcola cutoff
    const cutoff = Date.now() - filterDelta(window.currentFilter);

    // 3. Ridisegna solo gli eventi che rientrano nel periodo
    eventiMaster.forEach(function(e) {
        e.marker = null;
        let ts = null;
        if (e.data) {
            // accetta sia "2024-05-01T12:00:00" che "2024-05-01 12:00:00"
            ts = Date.parse(e.data.replace(' ', 'T'));
        }
        // se la data non è parsabile mostriamo comunque l'evento
        if (ts === null || isNaN(ts) || ts >= cutoff) {
            e.marker =_disegnaEvento(e);
        }
    });
}

// ── API esposte a Python ───────────────────────────────────────

// aggiunge un nuovo evento (usato per un singolo evento in arrivo, es. da Serenade batch)
window.aggiungiEvento = function(lat, lng, mag, data, qualita, area) {
    if (!map || !isInitialized) return;
    const e = { lat, lng, mag, data, qualita, area };
    eventiMaster.push(e);
    const cutoff = Date.now() - filterDelta(window.currentFilter);
    let ts = data ? Date.parse(data.replace(' ', 'T')) : NaN;
    if (isNaN(ts) || ts >= cutoff) {
        e.marker = _disegnaEvento(e);
    }
};

// aggiorna un evento esistente (stessa "chiave", es. revisione di una scossa) o lo crea se nuovo
window.upsertEvento = function(chiave, lat, lng, mag, data, qualita, area) {
    if (!map || !isInitialized) return;

    const nuovoDato = { chiave, lat, lng, mag, data, qualita, area };
    const idx = eventiMaster.findIndex(e => e.chiave === chiave);

    if (idx !== -1) {
        const vecchio = eventiMaster[idx];
        if (vecchio.marker) {
            map.removeLayer(vecchio.marker);
            const layerIdx = eventiLayer.indexOf(vecchio.marker);
            if (layerIdx !== -1) eventiLayer.splice(layerIdx, 1);
        }
        eventiMaster[idx] = nuovoDato;
    } else {
        eventiMaster.push(nuovoDato);
    }

    const cutoff = Date.now() - filterDelta(window.currentFilter);
    let ts = data ? Date.parse(String(data).replace(' ', 'T')) : NaN;
    if (isNaN(ts) || ts >= cutoff) {
        nuovoDato.marker = _disegnaEvento(nuovoDato);
    }
};

window.clearEventi = function() {
    eventiLayer.forEach(c => map && map.removeLayer(c));
    eventiLayer.length  = 0;
    eventiMaster.length = 0;   // svuota anche il master
};

// inserimento massivo di eventi (es. al caricamento iniziale dei log storici)
window.aggiungiEventiBatch = function(eventi) {
    if (!map || !isInitialized) return;
    eventi.forEach(function(e) {
        window.aggiungiEvento(e.lat, e.lng, e.mag, e.data, e.qualita, e.area);
    });
};

// collassa le revisioni della stessa scossa (righe entro tollSec) tenendo la mag più alta
function _rbCollassa(eventi, tollSec = 2) {
    const parsed = eventi
        .map(e => ({ ...e, _ts: Date.parse(String(e.data).replace(' ', 'T')) }))
        .filter(e => !isNaN(e._ts))
        .sort((a, b) => a._ts - b._ts);
    const out = [];
    for (const e of parsed) {
        const last = out[out.length - 1];
        if (last && (e._ts - last._ts) <= tollSec * 1000) {
            if (Number(e.mag) > Number(last.mag)) out[out.length - 1] = e;  // stessa scossa: tieni la più forte
        } else {
            out.push(e);
        }
    }
    return out;
}



let _rbMap = null;              // mini-mappa del riquadro
let _rbMarkers = [];            // pallini attualmente disegnati nel riquadro

// crea (una sola volta, lazy) la mini-mappa del riquadro di replay, riusando il tile provider attivo
function _rbInitMap() {
    if (_rbMap) return _rbMap;
    _rbMap = L.map('rb-plot', {
        zoomControl: false, attributionControl: false,
        dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
        boxZoom: false, keyboard: false, touchZoom: false
    });
    const cfg = window._baseMapCfg || { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom: 18 };
    L.tileLayer(cfg.url, { maxZoom: cfg.maxZoom }).addTo(_rbMap);
    return _rbMap;
}

// anima in sequenza gli eventi di uno sciame nel riquadro di replay (una scossa alla volta)
window.replaySciame = function(eventi, intervalloMs) {
    intervalloMs = 1200;   // ATTENZIONE: il parametro intervalloMs ricevuto viene ignorato e sovrascritto qui
    eventi = _rbCollassa(eventi);
    if (!eventi.length) return;

    const box   = document.getElementById('replay-box');
    const count = document.getElementById('rb-count');
    const magEl = document.getElementById('rb-mag');
    const meta  = document.getElementById('rb-meta');
    const prog  = document.getElementById('rb-progress');

    if (window._replayTimer) clearTimeout(window._replayTimer);
    box.classList.add('attivo');

    const mm = _rbInitMap();
    _rbMarkers.forEach(m => mm.removeLayer(m));
    _rbMarkers = [];

    // la mappa dentro un box nascosto non calcola bene le dimensioni:
    // forza il ricalcolo e inquadra tutte le scosse dello sciame
    setTimeout(() => {
        mm.invalidateSize();
        const b = L.latLngBounds(eventi.map(e => [+e.lat, +e.lng]));
        mm.fitBounds(b.pad(0.4), { maxZoom: 14 });
        avvia();
    }, 60);

    let i = 0;
    function avvia() {
        i = 0;
        step();
    }
    function step() {
        if (i >= eventi.length) { meta.textContent = 'Replay terminato'; return; }
        const e = eventi[i];

        // affievolisce i marker precedenti per evidenziare quello corrente
        _rbMarkers.forEach(m => m.setStyle({ fillOpacity: 0.3, opacity: 0.3 }));

        const c = L.circleMarker([+e.lat, +e.lng], {
            radius: 4 + (Number(e.mag) || 0) * 3,
            color: '#fff', weight: 1, opacity: 1,
            fillColor: magnitudo2colore(Number(e.mag)), fillOpacity: 1
        }).addTo(mm);
        _rbMarkers.push(c);

        magEl.textContent = (e.mag != null) ? `M${e.mag}` : 'M n.d.';
        magEl.style.color = magnitudo2colore(Number(e.mag));
        meta.textContent  = `${e.area || 'n.d.'} · ${e.data || ''}`;
        count.textContent = `${i + 1}/${eventi.length}`;
        prog.style.width  = `${Math.round((i + 1) / eventi.length * 100)}%`;

        i++;
        window._replayTimer = setTimeout(step, intervalloMs);
    }
};

window.clearReplaySciame = function() {
    if (window._replayTimer) { clearTimeout(window._replayTimer); window._replayTimer = null; }
    if (_rbMap) { _rbMarkers.forEach(m => _rbMap.removeLayer(m)); _rbMarkers = []; }
    const box = document.getElementById('replay-box');
    if (box) box.classList.remove('attivo');
};

// cambia il filtro temporale attivo (24h/48h/.../all) e ridisegna i pallini di conseguenza
window.setTimeFilter = function(value) {
    if (!map || !isInitialized) {
        const iv = setInterval(() => {
            if (map && isInitialized) {
                clearInterval(iv);
                window.currentFilter = value;
                applyFilter();
            }
        }, 100);
        setTimeout(() => clearInterval(iv), 5000);
        return;
    }
    window.currentFilter = value;
    applyFilter();
};

(function() {
    function start() {
        initMap();
        setTimeout(inizializzaVulcani, 200);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }

    window.addEventListener('resize', handleResize);
})();
</script>
