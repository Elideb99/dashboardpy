html, body {

/* ─── Legenda ─────────────────────────────────────────────── */
.legend {
    position: fixed;
    bottom: 20px;

.legend h4 {

.legend .row {

/**
 * @param {string} stato  – 'NORMALE' | 'ATTENZIONE' | 'ALLARME' | 'SCIAME'
 * @returns {number}
 */
function markerRadius(stato) {
    const base = Math.max(8, Math.round(window.innerWidth / 160));
    // ~12 a 1920px · ~20 a 3200px · ~27 a 4320px · ~40 a 6400px
    const delta = { 'ALLARME': 8, 'ATTENZIONE': 4, 'SCIAME': 6 };
    return base + (delta[stato] || 0);
}

/**
 * Raggio del cerchio di monitoraggio attorno al vulcano (in metri),
 * costante in termini geografici ma la funzione è centralizzata
 * per poterlo modificare facilmente.
 */
function circleRadius() {
    return 5000;   // 5 km – invariato sulla mappa geografica
}

/**
 * Padding fitBounds adattato alla larghezza schermo.
 */
function fitPadding() {
    const w = window.innerWidth;
    const p = Math.round(w / 25);   // ~77 a 1920 · ~154 a 3840 · ~250 a 6400
    return { paddingTopLeft: [p, p], paddingBottomRight: [p, p] };
}

/**
 * Zoom iniziale adattato alla larghezza schermo.
 * Su schermi piccoli la mappa mostra meno tile quindi zoom 10
 * va bene; su schermi enormi si può abbassare per mostrare
 * il contesto geografico più ampio.
 */
// function initialZoom() {
//     const w = window.innerWidth;
//     if (w >= 5000) return 10;
//     if (w >= 3200) return 11;
//     if (w >= 2000) return 11;
//     if (w >= 1200) return 12;
//     return 11;  // buon compromesso per tutti

function initialZoom() {
    const w = window.innerWidth;
    // Zoom molto alti per vedere i dettagli dei vulcani
    if (w >= 5000) return 12;
    if (w >= 3200) return 13;
    if (w >= 2000) return 13;
    if (w >= 1200) return 14;   // molto vicino su desktop
    return 13;                  // mobile
}

// E modifica anche il fitToVulcani per non allontanarsi troppo
function fitToVulcani() {
    if (!map) return;
    const bounds = getVulcaniBounds();
    // Usa maxZoom per evitare che si allontani troppo
    map.fitBounds(bounds, {
        padding: [30, 30],
        maxZoom: initialZoom()  // Usa lo stesso zoom iniziale
    });
}

function handleResize() {
    if (!map) return;
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        map.invalidateSize();
        fitToVulcani();

            if (v.marker) {
                v.marker.setRadius(markerRadius(v.stato));
            }
        }
    }, 250);

function initMap() {
    if (isInitialized && map !== null) return;
    if (map !== null) { map.remove(); map = null; }

    const container = document.getElementById('map');
    if (!container) { console.error('#map non trovato'); return; }

    try {
        map = L.map('map', {
            zoomControl:         true,
            fadeAnimation:       true,
            zoomAnimation:       true,
            markerZoomAnimation: true,
            inertia:             true,
            inertiaDeceleration: 3000,
            inertiaMaxSpeed:     1500
        });

        map.createPane('vulcaniPane');
map.getPane('vulcaniPane').style.zIndex = 650;  // sempre sopra i pallini eventi

map.createPane('eventiPane');
map.getPane('eventiPane').style.zIndex = 400;   // sotto i vulcani


        if (window.innerWidth <= 768) {
            map.zoomControl.setPosition('bottomright');
        }

        map.setView([40.82, 14.25], initialZoom());
        isInitialized = true;
        console.log('Mappa inizializzata');
    } catch (err) {
        console.error('Errore inizializzazione mappa:', err);
        isInitialized = false;
    }
}

window.setBaseMap = function(url, attribution, minZoom , maxZoom) {
    if (!map || !isInitialized) { initMap(); }

    setTimeout(() => {
        if (!map) { console.error('setBaseMap: mappa non disponibile'); return; }

        if (currentLayer) { map.removeLayer(currentLayer); }

        currentLayer = L.tileLayer(url, {
            minZoom:      minZoom || 0,
            maxZoom:      maxZoom || 20,
            attribution:  attribution,
            detectRetina: true
        }).addTo(map);

        setTimeout(() => { if (map) fitToVulcani(); }, 100);
    }, 50);
};

// Genera i punti di un cerchio approssimato come poligono
function generateRing(lat, lng, outerR, innerR, steps = 64) {
    const toRad = Math.PI / 180;
    const latR  = outerR / 111320;
    const lngR  = outerR / (111320 * Math.cos(lat * toRad));
    const latRi = innerR / 111320;
    const lngRi = innerR / (111320 * Math.cos(lat * toRad));

    const outer = [], inner = [];
    for (let i = 0; i < steps; i++) {
        const a = (2 * Math.PI * i) / steps;
        outer.push([lat + latR  * Math.sin(a), lng + lngR  * Math.cos(a)]);
        inner.push([lat + latRi * Math.sin(a), lng + lngRi * Math.cos(a)]);
    }
    return [outer, inner.reverse()]; // il buco va in senso opposto
}

// ══════════════════════════════════════════════════════════════
//  EVENTI SISMICI – pallini proporzionali alla magnitudo
// ══════════════════════════════════════════════════════════════

// Array master: contiene TUTTI gli eventi ricevuti (mai svuotato dal filtro)
const eventiMaster = [];
// Array dei marker attualmente sulla mappa
const eventiLayer  = [];

window.currentFilter = "24h";

// function magnitudo2raggio(mag) {
//     if (mag === null || mag === undefined) return 3;
//     return Math.min(3 + mag * mag * 1.8, 40);
// }

function magnitudo2raggio(mag) {

    if (mag === null || mag === undefined) {
        return 8;
    }

    mag = Number(mag);

    // raggio minimo visibile
    const base = 8;

    // crescita con magnitudo
    const scala = mag * mag * 2.5;

    // limite massimo
    return Math.min(base + scala, 45);
}

function magnitudo2colore(mag) {
    if (mag === null || mag === undefined) return '#aaaaaa';
    if (mag >= 3.5) return '#d32f2f';
    if (mag >= 2.0) return '#ff9800';
    if (mag >= 1.0) return '#ffeb3b';
    return '#4caf50';
}

// function filterDelta(filterKey) {
//     const MS = {
//         "24h":   24 * 3600 * 1000,
//         "48h":   48 * 3600 * 1000,
//         "7gg":    7 * 86400 * 1000,
//         "14gg":  14 * 86400 * 1000,
//         "1mese": 30 * 86400 * 1000,
//     };
//     return MS[filterKey] || MS["24h"];
// }

function filterDelta(filterKey) {
    if (filterKey === "all") {
        return Infinity;   
    }
    const MS = {
        "24h":   24 * 3600 * 1000,
        "48h":   48 * 3600 * 1000,
        "7gg":    7 * 86400 * 1000,
        "14gg":  14 * 86400 * 1000,
        "1mese": 30 * 86400 * 1000,
    };
    return MS[filterKey] || MS["24h"];
}

function _disegnaEvento(e) {
    const raggio = magnitudo2raggio(e.mag);
    const colore = magnitudo2colore(e.mag);
    const magStr = (e.mag !== null && e.mag !== undefined)
        ? `M${Number(e.mag).toFixed(1)}`
        : 'M n.d.';

    const pallino = L.circleMarker([e.lat, e.lng], {
        radius:      raggio,
        color:       colore,
        fillColor:   colore,
        fillOpacity: 0.75,
        weight:      1,
        pane:        'eventiPane'
    }).addTo(map);

    pallino.bindPopup(`
        <div style="min-width:130px; font-size:0.95em;">
            <b>${magStr}</b><br>
            ${e.data}<br>
            Qualità: ${e.qualita}<br>
            <small>(${Number(e.lat).toFixed(4)}, ${Number(e.lng).toFixed(4)})</small>
        </div>
    `);

    eventiLayer.push(pallino);
}

function applyFilter() {
    // 1. Rimuovi tutti i marker dalla mappa
    eventiLayer.forEach(c => map && map.removeLayer(c));
    eventiLayer.length = 0;

    // 2. Calcola cutoff
    const cutoff = Date.now() - filterDelta(window.currentFilter);

    // 3. Ridisegna solo gli eventi che rientrano nel periodo
    eventiMaster.forEach(function(e) {
        let ts = null;
        if (e.data) {
            // accetta sia "2024-05-01T12:00:00" che "2024-05-01 12:00:00"
            ts = Date.parse(e.data.replace(' ', 'T'));
        }
        // se la data non è parsabile mostriamo comunque l'evento
        if (ts === null || isNaN(ts) || ts >= cutoff) {
            _disegnaEvento(e);
        }
    });
}

// ── API esposte a Python ───────────────────────────────────────

window.aggiungiEvento = function(lat, lng, mag, data, qualita) {
    if (!map || !isInitialized) return;
    const e = { lat, lng, mag, data, qualita };
    eventiMaster.push(e);
    // disegna solo se rientra nel filtro attivo
    const cutoff = Date.now() - filterDelta(window.currentFilter);
    let ts = data ? Date.parse(data.replace(' ', 'T')) : NaN;
    if (isNaN(ts) || ts >= cutoff) {
        _disegnaEvento(e);
    }
};

window.clearEventi = function() {
    eventiLayer.forEach(c => map && map.removeLayer(c));
    eventiLayer.length  = 0;
    eventiMaster.length = 0;   // svuota anche il master
};

window.aggiungiEventiBatch = function(eventi) {
    if (!map || !isInitialized) return;
    eventi.forEach(function(e) {
        window.aggiungiEvento(e.lat, e.lng, e.mag, e.data, e.qualita);
    });
};

window.setTimeFilter = function(value) {
    window.currentFilter = value;
    applyFilter();          // ridisegna con il nuovo cutoff
};

        document.addEventListener('DOMContentLoaded', start);
    } else {

    window.addEventListener('resize', handleResize);
})();
